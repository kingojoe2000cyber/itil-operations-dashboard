name: Bootstrap ITIL dashboard source

on:
  push:
    paths:
      - "Richmond_Kwadwo_Sarpong_ITIL_Dashboard_Updated.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract the verified dashboard package
        run: |
          unzip -o Richmond_Kwadwo_Sarpong_ITIL_Dashboard_Updated.zip
          rm Richmond_Kwadwo_Sarpong_ITIL_Dashboard_Updated.zip
          rm .github/workflows/deploy-pages.yml

      - name: Commit the complete project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy complete ITIL operations dashboard"
          git push
